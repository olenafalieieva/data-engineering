plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'org.replog.MasterApplication'
}

run {
    standardInput = System.in
}

tasks.register('runMaster', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.replog.MasterApplication'
    standardInput = System.in
}

tasks.register('runSecondary', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.replog.SecondaryApplication'
    standardInput = System.in
}


group = 'org.replog'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.16.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()

    // Use the test logging config (FINE level) and print all test and application output to the console
    systemProperty 'java.util.logging.config.file', file('src/test/resources/logging.properties').absolutePath
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped', 'standardOut', 'standardError'
    }
}